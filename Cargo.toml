[workspace]
members = [".", "hako", "hako/http", "kura-core", "kura-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hako = { path = "hako", default-features = false }
kura-core = { path = "kura-core" }
kura-server = { path = "kura-server" }

axum = "0.8"
bytes = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.32"
hex = "0.4.3"
image = "0.25.10"
jiff = { version = "0.2.24", features = ["serde"] }
miette = { version = "7.6.0", features = ["fancy"] }
nucleo-matcher = "0.3.1"
ratatui = "0.30.0"
ratatui-image = { version = "11.0.2", features = ["tokio"] }
reqwest = { version = "0.13.3", features = ["stream"] }
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "macros"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["rt", "io"] }
toml_edit = "0.25.19"

[package]
name = "kura"
description = "tool to manage all your memes. Kura = Storehouse in japanese"
version.workspace = true
edition.workspace = true

[lints.clippy]
format_push_string = "warn"
implicit_clone     = "warn"
use_self           = "warn"

[profile.release]
codegen-units = 1
lto           = true
panic         = "abort"
strip         = true

[dependencies]
clap = { workspace = true }
hako = { workspace = true, features = ["tui"] }
kura-core = { workspace = true }
kura-server = { workspace = true }
image = { workspace = true }
miette = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
